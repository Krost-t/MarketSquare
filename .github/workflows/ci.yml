name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  NODE_VERSION: 22

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marketsquare
          POSTGRES_PASSWORD: marketsquare
          POSTGRES_DB: marketsquare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketsquare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://marketsquare:marketsquare@localhost:5432/marketsquare?schema=public
      JWT_SECRET: ci-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo install --check

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marketsquare
          POSTGRES_PASSWORD: marketsquare
          POSTGRES_DB: marketsquare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketsquare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://marketsquare:marketsquare@localhost:5432/marketsquare?schema=public
      JWT_SECRET: ci-secret
      EXPRESS_PORT: 4896
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Start API
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run seed
          npx tsx src/index.ts &
      - name: Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: web
          start: npm run dev
          wait-on: "http://localhost:5173, http://localhost:4896"
